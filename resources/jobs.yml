resources:
  jobs:
    wine_quality_daily_job:
      name: wine_quality_daily_job_${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # daily 06:00 UTC — {{REFRESH_CADENCE}}
        timezone_id: UTC

      tasks:
        - task_key: run_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.wine_quality_pipeline.id}
          # No cluster needed: serverless pipeline tasks always run on managed compute.

        - task_key: train_and_register_model
          depends_on:
            - task_key: run_pipeline
          spark_python_task:
            python_file: ../src/ml/classification/train.py
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              # MLflow cannot infer an experiment for a spark_python_task, so the
              # bundle names one explicitly, per-target.
              - "--experiment-path"
              - "/Users/${workspace.current_user.userName}/${bundle.name}_${bundle.target}"
          environment_key: default   # required for spark_python_task on serverless

      # scikit-learn, optuna and mlflow's optuna integration aren't in the base
      # serverless image, so they're declared here rather than assumed present.
      # mlflow must be pinned to 3.x explicitly: environment_version "2" ships an
      # older mlflow, and train.py imports mlflow.optuna.storage /
      # mlflow.pyspark.optuna.study, which only exist in MLflow 3.
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - scikit-learn
              - optuna
              - mlflow>=3.1.0
