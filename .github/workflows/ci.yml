name: CI

on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The unit tests run pyspark against a local JVM; Spark 4.x requires Java 17+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit -v

  validate-bundle:
    name: Validate bundle (dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      # --strict promotes config warnings to errors, so a malformed resource file
      # fails the PR instead of surfacing at deploy time.
      - name: databricks bundle validate -t dev
        run: databricks bundle validate --strict -t dev
        env:
          # OAuth M2M for the dev service principal. The workspace host comes from
          # databricks.yml, so only credentials are injected here.
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_DEV_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_DEV_CLIENT_SECRET }}
