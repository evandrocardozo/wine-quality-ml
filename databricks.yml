bundle:
  name: wine_quality_ml       # rename to {{CASE_CODENAME}} for a real case

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog this target writes to
  schema:
    description: Schema holding bronze/silver/gold tables + the registered model
    default: wine_quality

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-90098d3d-a1d9.cloud.databricks.com
    variables:
      catalog: wine_quality_dev

  staging:
    mode: production
    workspace:
      host: https://<staging-workspace-host>
    variables:
      catalog: wine_quality_staging   # not created yet — staging workspace is still a placeholder

  prod:
    mode: production
    workspace:
      host: https://<prod-workspace-host>
    variables:
      catalog: wine_quality_prod      # not created yet — prod workspace is still a placeholder
    run_as:
      service_principal_name: <prod-service-principal>